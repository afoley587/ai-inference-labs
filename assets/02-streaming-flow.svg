<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Stream flows from mock backend through Go gateway to client</title><rect width="1200" height="630" fill="#0B1223"/><path d="M0 530 Q400 360 1200 530" stroke="#243353" stroke-width="2" fill="none"/><text x="55" y="80" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">KEEP THE STREAM MOVING</text><rect x="80" y="220" width="280" height="154" rx="18" fill="#4B3473"/><text x="124" y="280" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#F8FAFC">Mock backend</text><text x="129" y="324" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#E4D8FA">SSE data events</text><rect x="460" y="220" width="280" height="154" rx="18" fill="#155E75"/><text x="506" y="280" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#F8FAFC">Go gateway</text><text x="492" y="324" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#DCF5FF">Read → Write → Flush</text><rect x="840" y="220" width="280" height="154" rx="18" fill="#29495A"/><text x="919" y="280" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="500" fill="#F8FAFC">Client</text><text x="909" y="324" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#C7DCE9">curl -N</text><text x="370" y="305" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="500" fill="#F8FAFC">→</text><text x="748" y="305" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="500" fill="#F8FAFC">→</text><text x="65" y="485" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#D1D5DB">Forward bytes incrementally; do not read the entire response first.</text><text x="65" y="537" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#9CA3AF">Client disconnect cancels the upstream request context.</text></svg>