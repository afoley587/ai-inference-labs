<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Prefill and decode are two different inference workloads</title><rect width="1200" height="630" fill="#0B1223"/><path d="M0 530 Q400 360 1200 530" stroke="#243353" stroke-width="2" fill="none"/><text x="60" y="70" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#9CA3AF">AI INFERENCE LABS  /  FIELD GUIDE</text><text x="60" y="158" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="700" fill="#FFFFFF">Why LLM Inference Is</text><text x="60" y="221" font-family="Arial,Helvetica,sans-serif" font-size="53" font-weight="700" fill="#FFFFFF">Two Different Problems</text><rect x="62" y="292" width="500" height="220" rx="18" fill="#16344E"/><text x="94" y="359" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#70D6FF">PREFILL</text><text x="94" y="405" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#F8FAFC">Process prompt tokens</text><text x="94" y="446" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#B9D8EC">Parallel compute pressure</text><rect x="632" y="292" width="500" height="220" rx="18" fill="#35234F"/><text x="664" y="359" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" fill="#D6B4FF">DECODE</text><text x="664" y="405" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="500" fill="#F8FAFC">Generate tokens one at a time</text><text x="664" y="446" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#DDCEF1">Memory and cache pressure</text><text x="587" y="408" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#FFFFFF">→</text><text x="63" y="578" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#94A3B8">AI Infrastructure  •  Scheduling  •  KV Cache</text></svg>