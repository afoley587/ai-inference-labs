<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Illustrative latency timeline with queue, prefill, and decode</title><rect width="1200" height="630" fill="#0B1223"/><path d="M0 530 Q400 360 1200 530" stroke="#243353" stroke-width="2" fill="none"/><text x="60" y="78" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">WHAT THE USER EXPERIENCES</text><text x="60" y="137" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#C5D2E6">Time to first token includes more than prefill</text><rect x="65" y="237" width="180" height="112" rx="6" fill="#334155"/><rect x="245" y="237" width="345" height="112" rx="6" fill="#135E81"/><rect x="590" y="237" width="545" height="112" rx="6" fill="#5B3B8B"/><text x="103" y="284" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="500" fill="#F8FAFC">Queue</text><text x="103" y="319" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#F8FAFC">+ network</text><text x="330" y="297" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#F8FAFC">Prefill</text><text x="815" y="297" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" fill="#F8FAFC">Decode</text><path d="M65 380H590 M65 368V392 M590 368V392" stroke="#76D2F8" stroke-width="4"/><text x="207" y="429" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#76D2F8">TTFT: first visible token</text><text x="690" y="429" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="500" fill="#D6B4FF">Inter-token latency</text><text x="65" y="546" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="500" fill="#CBD5E1">Illustrative proportions only; not measured benchmark data</text></svg>