<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>Prompt to prefill to KV cache to repeated decode</title><rect width="1200" height="630" fill="#0B1223"/><path d="M0 530 Q400 360 1200 530" stroke="#243353" stroke-width="2" fill="none"/><text x="55" y="77" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">FROM PROMPT TO GENERATED TOKENS</text><rect x="70" y="200" width="230" height="144" rx="18" fill="#263449"/><text x="105" y="260" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="500" fill="#F8FAFC">Prompt</text><text x="105" y="301" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#CBD5E1">Input tokens</text><rect x="380" y="200" width="230" height="144" rx="18" fill="#145577"/><text x="417" y="260" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="500" fill="#F8FAFC">Prefill</text><text x="401" y="301" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#D8F2FF">Build KV state</text><rect x="690" y="200" width="200" height="144" rx="18" fill="#49316E"/><text x="722" y="260" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="500" fill="#F8FAFC">Decode</text><text x="712" y="301" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#F0E2FF">Next token</text><text x="314" y="282" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="500" fill="#F8FAFC">→</text><text x="625" y="282" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="500" fill="#F8FAFC">→</text><text x="905" y="282" font-family="Arial,Helvetica,sans-serif" font-size="55" font-weight="500" fill="#F8FAFC">→</text><rect x="960" y="200" width="184" height="144" rx="18" fill="#264B45"/><text x="990" y="260" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="500" fill="#F8FAFC">Output</text><text x="990" y="301" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" fill="#CFF9E7">Token stream</text><rect x="406" y="402" width="450" height="105" rx="18" fill="#1E293B"/><text x="448" y="446" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#F8FAFC">KV cache persists across steps</text><text x="445" y="483" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#CBD5E1">Decode repeats until completion</text><text x="90" y="575" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" fill="#94A3B8">Conceptual architecture — not a hardware timing diagram</text></svg>