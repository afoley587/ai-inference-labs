name: Go CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 02-streaming-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 02-streaming-gateway/go.mod
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Tests with race detector
        run: go test -race ./...
      - name: Build
        run: go build ./...
